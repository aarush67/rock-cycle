<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Cycle Animation</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LGQNDPYY8F"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-LGQNDPYY8F');
</script>
</head>
<body>
    <h1>The Rock Cycle</h1>
    <button id="startButton">Start Animation</button>
    <p id="statusText">Press "Start Animation"</p>
    <canvas id="rockCanvas"></canvas>

    <div id="labels">
        <p id="lavaLabel">Lava cooling → Igneous rock</p>
        <p id="igneousLabel">Igneous rock breaks into sediments</p>
        <p id="weatheringLabel">Sediments carried by river</p>
        <p id="sedimentLabel">Sediments deposit & become Sedimentary rock</p>
        <p id="sedimentaryLabel">Sedimentary rock goes underground</p>
        <p id="metamorphicLabel">Heat & pressure form Metamorphic rock</p>
        <p id="magmaLabel">Metamorphic rock melts into magma</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
